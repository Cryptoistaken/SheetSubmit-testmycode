<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bubble Design — SheetSubmit</title>
<style>
  :root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--radius:16px}
  *{box-sizing:border-box}body{margin:0;font-family:Geist,Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
  .wrap{max-width:100%;margin:0 auto;padding:12px 12px 90px}
  .top{position:sticky;top:0;z-index:5;background:rgba(248,250,252,.96);backdrop-filter:blur(8px);display:flex;align-items:center;gap:10px;padding:10px 0 10px;margin:0 -12px 8px;border-bottom:1px solid var(--line);padding-left:12px;padding-right:12px}
  .back{width:34px;height:34px;border-radius:999px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;font-size:20px;line-height:1}
  .top b{font-size:15px;letter-spacing:-.02em}
  .top span{margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:999px}
  h1{margin:10px 0 2px;font-size:18px;letter-spacing:-.02em} .sub{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
  .card h3{margin:0;font-size:13px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .card h3 i{width:24px;height:24px;border-radius:7px;background:#f1f5f9;display:grid;place-items:center;font-style:normal;font-size:13px}
  .card small{display:none}
  .iconRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .iconOpt{width:48px;height:48px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;cursor:pointer;background:#fff;transition:.15s;position:relative;flex-shrink:0}
  .iconOpt.on{border-color:var(--text)}
  .iconOpt .ic{width:28px;height:28px;display:grid;place-items:center}
  .iconOpt .ic svg,.iconOpt .ic object{width:100%;height:100%;display:block;border:0}
  .iconLabel{display:none}
  .swatches{display:flex;gap:1px;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;margin-top:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .swatches::-webkit-scrollbar{display:none}
  .sw{width:20px;height:30px;border-radius:5px;border:2px solid transparent;cursor:pointer;position:relative;flex-shrink:0}
  .sw.on{border-color:var(--text)}
  .sw.customBtn{width:20px;height:30px;padding:0;display:grid;place-items:center;background:#fff;border-color:var(--line);flex-shrink:0}
  .inlineCustom{display:none;gap:8px;align-items:center;margin-top:10px}
  .inlineCustom.on{display:flex}
  .inlineCustom input[type=color]{width:40px;height:36px;padding:3px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .inlineCustom input[type=text]{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px}

  .rangeWrap{margin-top:12px}
  .range{width:100%;accent-color:var(--text)}
  .rangeLabels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
  .rangeLabels b{color:var(--text);font-size:12px}
  .toggleRow{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:12px}

  .foot{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;max-width:640px;margin:0 auto}
  .btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13px;cursor:pointer}
  .btnPrimary{background:var(--text);color:#fff;border-color:var(--text)}
  .hint{font-size:11px;color:var(--muted);text-align:center;margin-top:8px}
  /* floating enabled bubble itself — transparent */
  .float-bubble{position:fixed;z-index:40;touch-action:none;user-select:none;display:grid;place-items:center;filter:none;cursor:grab;background:transparent}
  .float-bubble:active{cursor:grabbing;filter:none}
  .float-bubble svg,.float-bubble object{width:100%;height:100%;display:block;pointer-events:none;border:0}
  .float-bubble .tip{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);background:#0f172a;color:#fff;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 8px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:.2s}
  .float-bubble.dragging .tip{opacity:1}


  .mono{font-family:ui-monospace,monospace}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" onclick="history.back()">‹</button>
    <b>Sheet Submit</b>
    <span>Bubble design</span>
  </div>
  <h1>Bubble design</h1>

  <div class="card">
    <h3><i>⬢</i> Icon</h3>
    <div class="iconRow" id="iconGrid"></div>
  </div>

  <div class="card">
    <h3><i>◉</i> Color</h3>
    <div class="swatches" id="swatches"></div>
    <div class="inlineCustom" id="inlineCustom">
      <input type="color" id="cpPick" value="#000000"/>
      <input type="text" id="cpText" class="mono" value="#000000" maxlength="7" spellcheck="false"/>
      <button class="btn btnPrimary" style="padding:8px 14px" onclick="applyCustom()">Use</button>
    </div>
  </div>

  <div class="card">
    <h3><i>↔</i> Size</h3>
    <div class="rangeWrap">
      <input type="range" id="sizeRange" class="range" min="36" max="84" step="2" value="60"/>
      <div class="rangeLabels"><span>Small</span><b id="sizeVal" class="mono">60 dp</b><span>Large</span></div>
    </div>
  </div>







  <div class="hint" id="saveHint" style="display:none"></div>
</div>

<!-- enabled bubble itself — live preview, draggable -->
<div class="float-bubble" id="bubble" aria-label="Floating bubble preview">
  <span class="tip">drag me</span>
</div>


<div class="foot">
  <button class="btn" onclick="resetState()">Reset</button>
  <button class="btn btnPrimary" onclick="saveState()">Save</button>
</div>

<script>
const icons = {
  logo: `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"><rect x="2" y="2" width="20" height="20" rx="5" fill="currentColor"/><path d="M7 8h10M7 12h10M7 16h7" stroke="white" stroke-width="1.6" stroke-linecap="round"/></svg>`,
  claude: `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="230" fill="currentColor"/><g fill="#111111"><rect x="250" y="350" width="120" height="240" rx="20"/><rect x="650" y="350" width="120" height="240" rx="20"/></g><g fill="#FFFFFF"><rect x="270" y="380" width="40" height="60" rx="10"/><rect x="670" y="380" width="40" height="60" rx="10"/></g><path d="M -50 600 L 150 600 L 150 800 L -50 800 Z" fill="#C46044"/><path d="M 874 600 L 1074 600 L 1074 800 L 874 800 Z" fill="#C46044"/></svg>`,
  claudeCode: `<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1024" height="1024" rx="230" fill="currentColor"/><g fill="#111111"><rect x="250" y="350" width="120" height="240" rx="20"/><rect x="650" y="350" width="120" height="240" rx="20"/></g><g fill="#FFFFFF"><rect x="270" y="380" width="40" height="60" rx="10"/><rect x="670" y="380" width="40" height="60" rx="10"/></g><path d="M -50 600 L 150 600 L 150 800 L -50 800 Z" fill="#C46044"/><path d="M 874 600 L 1074 600 L 1074 800 L 874 800 Z" fill="#C46044"/></svg>`,
  pacman: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%"><path fill="currentColor" d="M 150,150 L 236.6,100 A 100 100 0 1 0 236.6,200 Z"/><circle cx="180" cy="110" r="12" fill="#000"/><circle cx="183" cy="106" r="3.5" fill="#fff" opacity="0.9"/></svg>`
};
const iconMeta = [
  {id:"logo", label:"SheetSubmit", sub:"Logo"},
  {id:"claude", label:"Claude", sub:"Static"},
  {id:"claudeCode", label:"Claude Code", sub:"Animated"},
  {id:"pacman", label:"Pac-Man", sub:"Static"},
];
const colors = ["#000000","#1e293b","#334155","#64748b","#ffffff","#fff000","#fde68a","#f59e0b","#f97316","#ea580c","#ef4444","#dc2626","#e11d48","#be185d","#E89B83","#C46044","#a855f7","#7e22ce","#8b5cf6","#4f46e5","#2563eb","#1d4ed8","#06b6d4","#0891b2","#0e7490","#047857","#22c55e","#16a34a"];

let state = JSON.parse(localStorage.getItem("mock_bubble")||"null") || {icon:"logo", color:"#ef4444", size:60, x: null, y: null};
if(typeof state.pacAnimEnabled!=="undefined") delete state.pacAnimEnabled;
if(typeof state.anim==="string") delete state.anim;
if(typeof state.animEnabled!=="undefined") delete state.animEnabled;

function persist(){ localStorage.setItem("mock_bubble", JSON.stringify(state)); }

const claudeCodeSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 3 16 13" width="100%" height="100%" style="display:block"><defs><style>.action-body{transform-origin:7.5px 13px;animation:action-body 16s infinite ease-in-out}.breathe-anim{transform-origin:7.5px 13px;animation:breathe 3.2s infinite ease-in-out}.shadow-anim{transform-origin:7.5px 15.5px;animation:shadow-action 16s infinite ease-in-out}.arm-l{transform-origin:1px 10px;animation:arm-l-idle 16s infinite ease-in-out}.arm-r{transform-origin:14px 10px;animation:arm-r-idle 16s infinite ease-in-out}.eyes-look{animation:eye-track 16s infinite ease-in-out}.eyes-blink{transform-origin:7.5px 9px;animation:eye-blink 16s infinite linear}.yawn-mouth{transform-origin:7.5px 11px;animation:yawn-mouth-anim 16s infinite ease-in-out;opacity:0}.yawn-tear{animation:tear-fall 16s infinite ease-in-out;opacity:0}@keyframes breathe{0%,100%{transform:scale(1,1) translate(0,0)}50%{transform:scale(1.02,0.98) translate(0,0.5px)}}@keyframes action-body{0%,8%,26%,38%,55%,80%,100%{transform:scale(1,1) translate(0,0)}12%,22%{transform:scale(1,1) translate(1px,0)}42%,50%{transform:scale(1,1) translate(-1px,0)}30%,36%{transform:scale(1,1) translate(0.5px,0)}60%{transform:scale(0.95,1.05) translate(0px,-1px)}65%{transform:scale(0.9,1.1) translate(0px,-2px)}72%{transform:scale(1.05,0.95) translate(0px,1px)}76%{transform:scale(1,1) translate(0px,0px)}}@keyframes shadow-action{0%,8%,26%,38%,55%,80%,100%{transform:scaleX(1) translate(0,0);opacity:0.5}12%,22%{transform:scaleX(1) translate(1px,0);opacity:0.5}42%,50%{transform:scaleX(1) translate(-1px,0);opacity:0.5}30%,36%{transform:scaleX(1) translate(0.5px,0);opacity:0.5}60%{transform:scaleX(0.95) translate(0,0);opacity:0.45}65%{transform:scaleX(0.9) translate(0,0);opacity:0.4}72%{transform:scaleX(1.05) translate(0,0);opacity:0.55}76%{transform:scaleX(1) translate(0,0);opacity:0.5}}@keyframes eye-track{0%,10%,25%,38%,52%,58%,80%,100%{transform:translate(0px,0px)}12%,22%{transform:translate(3px,0px)}42%,50%{transform:translate(-3px,0px)}60%,75%{transform:translate(0px,-1px)}}@keyframes eye-blink{0%,3%,7%,18%,22%,43%,47%,56%,83%,87%,100%{transform:scaleY(1)}5%,20%,45%,85%{transform:scaleY(0.1)}60%{transform:scaleY(1)}62%,72%{transform:scaleY(0.1)}75%{transform:scaleY(1)}}@keyframes arm-l-idle{0%,28%{transform:translate(0,0) rotate(0deg)}30%{transform:translate(1px,-3px) rotate(15deg)}31%{transform:translate(1.5px,-4px) rotate(35deg)}32%{transform:translate(0.5px,-2.5px) rotate(0deg)}33%{transform:translate(1.5px,-4px) rotate(35deg)}34%{transform:translate(0.5px,-2.5px) rotate(0deg)}35%{transform:translate(1.5px,-4px) rotate(35deg)}36%{transform:translate(0.5px,-2.5px) rotate(0deg)}38%,58%{transform:translate(0,0) rotate(0deg)}62%{transform:translate(-1px,-2px) rotate(45deg)}65%{transform:translate(-2px,-3px) rotate(80deg)}72%{transform:translate(0px,1px) rotate(-15deg)}76%,100%{transform:translate(0,0) rotate(0deg)}}@keyframes arm-r-idle{0%,58%{transform:translate(0,0) rotate(0deg)}62%{transform:translate(1px,-2px) rotate(-45deg)}65%{transform:translate(2px,-3px) rotate(-80deg)}72%{transform:translate(0px,1px) rotate(15deg)}76%,100%{transform:translate(0,0) rotate(0deg)}}@keyframes yawn-mouth-anim{0%,58%,76%,100%{opacity:0;transform:scale(0.1)}60%{opacity:1;transform:scale(0.5,0.2)}65%{opacity:1;transform:scale(1.1,1.4)}72%{opacity:1;transform:scale(0.6,0.4)}75%{opacity:0;transform:scale(0.1)}}@keyframes tear-fall{0%,64%,80%,100%{opacity:0;transform:translateY(0)}66%{opacity:1;transform:translateY(0)}72%{opacity:1;transform:translateY(2.5px)}75%{opacity:0;transform:translateY(3px)}}</style></defs><rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/><g fill="currentColor"><rect x="3" y="13" width="1" height="2"/><rect x="5" y="13" width="1" height="2"/><rect x="9" y="13" width="1" height="2"/><rect x="11" y="13" width="1" height="2"/></g><g class="action-body"><g class="breathe-anim"><rect x="2" y="6" width="11" height="7" fill="currentColor"/><g class="arm-l"><rect x="0" y="9" width="2" height="2" fill="currentColor"/></g><g class="arm-r"><rect x="13" y="9" width="2" height="2" fill="currentColor"/></g><rect class="yawn-mouth" x="6" y="10" width="3" height="2" fill="#000"/><g class="eyes-look" fill="#000"><g class="eyes-blink"><rect x="4" y="8" width="1" height="2"/><rect x="10" y="8" width="1" height="2"/></g></g><rect class="yawn-tear" x="3.5" y="10" width="1" height="1" fill="#40C4FF"/></g></g></svg>`;
function render(){
  if(!icons[state.icon]) state.icon="claude";
  const b=document.getElementById("bubble");
  const s=state.size;
  b.style.width=s+"px"; b.style.height=s+"px";
  b.style.color=state.color;
  if(state.icon==="claudeCode"){
    b.innerHTML = `<div style="width:100%;height:100%;color:${state.color}">${claudeCodeSvg}</div><span class="tip">drag me — animated</span>`;
  } else {
    b.innerHTML = `<div style="width:100%;height:100%;color:${state.color}">${icons[state.icon]}</div><span class="tip">drag me</span>`;
  }
  b.className="float-bubble";
  if(state.x!=null && state.y!=null){
    b.style.left=state.x+"px"; b.style.top=state.y+"px"; b.style.right="auto"; b.style.bottom="auto";
  } else {
    b.style.left="auto"; b.style.top="88px"; b.style.right="16px"; b.style.bottom="auto";
  }
  document.getElementById("sizeVal").textContent=s+" dp";
  document.querySelectorAll(".iconOpt").forEach(el=>el.classList.toggle("on", el.dataset.id===state.icon));
  const lbl=document.getElementById("iconLabel");
  if(lbl) lbl.innerHTML = iconMeta.map(m=>`<span class="${m.id===state.icon?"on":""}">${m.label}</span>`).join(" • ");
  document.querySelectorAll(".sw").forEach(el=>{
    if(!el.dataset.c) return;
    el.classList.toggle("on", el.dataset.c.toLowerCase()===state.color.toLowerCase());
  });
  document.getElementById("sizeRange").value = s;
}

function isLight(hex){
  const h=hex.replace("#",""); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b) > 160;
}

function mount(){
  const g=document.getElementById("iconGrid"); g.innerHTML="";
  iconMeta.forEach(m=>{
    const isCC = m.id==="claudeCode";
    const btn=document.createElement("button"); btn.className="iconOpt"; btn.dataset.id=m.id;
    btn.title=m.label+" — "+m.sub;
    const mini = isCC ? `<div style="width:28px;height:28px;color:${state.color}">${claudeCodeSvg}</div>` : `<div style="width:28px;height:28px;color:${state.color}">${icons[m.id]}</div>`;
    btn.innerHTML=`<div class="ic" style="color:${state.color}">${mini}</div>`;
    btn.onclick=()=>{ state.icon=m.id; persist(); render(); mountColors(); };
    g.appendChild(btn);
  });
  const sw=document.getElementById("swatches"); sw.innerHTML="";
  const customBtn=document.createElement("button"); customBtn.className="sw customBtn"; customBtn.id="customBtn";
  customBtn.innerHTML=`<span style="width:10px;height:10px;border-radius:3px;background:conic-gradient(from 0deg,#ef4444,#f59e0b,#22c55e,#06b6d4,#8b5cf6,#ef4444);border:1px solid rgba(0,0,0,.15)"></span>`;
  customBtn.title="Custom"; customBtn.onclick=()=>{
    const ic=document.getElementById("inlineCustom");
    ic.classList.toggle("on");
    if(ic.classList.contains("on")){
      document.getElementById("cpPick").value=state.color;
      document.getElementById("cpText").value=state.color;
    }
  };
  sw.appendChild(customBtn);
  colors.forEach(c=>{
    const b=document.createElement("button"); b.className="sw"; b.dataset.c=c.toLowerCase(); b.style.background=c; if(c.toLowerCase()==="#ffffff") b.style.borderColor="var(--line)";
    b.title=c; b.onclick=()=>{state.color=c.toLowerCase(); persist(); render(); mountColors();};
    sw.appendChild(b);
  });
  mountColors();
}
function mountColors(){
  document.querySelectorAll(".iconOpt .ic").forEach(el=>el.style.color=state.color);
}

function applyCustom(){
  let v=document.getElementById("cpText").value.trim().toLowerCase();
  if(!v.startsWith("#")) v="#"+v;
  if(/^#[0-9a-fA-F]{6}$/.test(v)){ state.color=v; persist(); render(); mountColors(); }
  document.getElementById("inlineCustom").classList.remove("on");
}
document.getElementById("cpPick").addEventListener("input", e=>{
  const v=e.target.value.toLowerCase();
  document.getElementById("cpText").value=v;
  state.color=v; persist(); render(); mountColors();
});
document.getElementById("cpText").addEventListener("input", e=>{
  let v=e.target.value.trim(); if(!v.startsWith("#")) v="#"+v;
  v=v.toLowerCase();
  if(/^#[0-9a-fA-F]{6}$/.test(v)){ state.color=v; persist(); render(); mountColors(); }
  document.getElementById("cpPick").value=v;
});
document.getElementById("sizeRange").addEventListener("input", e=>{state.size=+e.target.value; persist(); render();});

function resetState(){ state={icon:"logo", color:"#ef4444", size:60, x:null, y:null}; persist(); render(); mountColors(); toast("Reset to default"); }
function saveState(){ persist(); toast("Saved — bubble_icon="+state.icon+" bubble_color="+state.color+" bubble_size="+state.size); }
function toast(m){ const h=document.getElementById("saveHint"); h.textContent=m; h.style.display="block"; setTimeout(()=>h.style.display="none",2600); }

// drag single bubble transparent
(function(){
  const b=document.getElementById("bubble");
  let dragging=false, moved=false, sx=0, sy=0, ox=0, oy=0;
  function pos(){ const r=b.getBoundingClientRect(); return {x:r.left, y:r.top}; }
  b.addEventListener("pointerdown", e=>{
    b.setPointerCapture(e.pointerId);
    dragging=true; moved=false;
    const p=pos(); ox=p.x; oy=p.y; sx=e.clientX; sy=e.clientY;
    b.classList.add("dragging");
  });
  b.addEventListener("pointermove", e=>{
    if(!dragging) return;
    const dx=e.clientX - sx, dy=e.clientY - sy;
    if(Math.abs(dx)>3 || Math.abs(dy)>3) moved=true;
    if(moved){
      const nx=Math.max(4, Math.min(window.innerWidth - b.offsetWidth -4, ox+dx));
      const ny=Math.max(4, Math.min(window.innerHeight - b.offsetHeight -4, oy+dy));
      b.style.left=nx+"px"; b.style.top=ny+"px"; b.style.right="auto"; b.style.bottom="auto";
    }
  });
  b.addEventListener("pointerup", e=>{
    if(!dragging) return;
    dragging=false; b.classList.remove("dragging");
    if(moved){
      const r=b.getBoundingClientRect();
      state.x=Math.round(r.left); state.y=Math.round(r.top); persist();
    }
  });
  b.addEventListener("click", e=>{ if(moved) e.preventDefault(); });
})();

mount(); render();
</script>
</body>
</html>
